name: Build Heaps Android Proof
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.6'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'ndk;28.2.13676358' 'cmake;3.30.3'
      - uses: actions/cache@v4
        with:
          path: vendor/.cache
          key: native-sources-${{ runner.os }}-${{ hashFiles('third_party/dependencies.lock.json') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare private stable test identity
        if: github.event_name != 'pull_request'
        env:
          HEAPS_ANDROID_TEST_KEYSTORE: ${{ secrets.HEAPS_ANDROID_TEST_KEYSTORE }}
          HEAPS_ANDROID_TEST_STORE_PASSWORD: ${{ secrets.HEAPS_ANDROID_TEST_STORE_PASSWORD }}
          HEAPS_ANDROID_TEST_KEY_PASSWORD: ${{ secrets.HEAPS_ANDROID_TEST_KEY_PASSWORD }}
          HEAPS_ANDROID_TEST_KEY_ALIAS: ${{ secrets.HEAPS_ANDROID_TEST_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          names = ['HEAPS_ANDROID_TEST_KEYSTORE','HEAPS_ANDROID_TEST_STORE_PASSWORD','HEAPS_ANDROID_TEST_KEY_PASSWORD','HEAPS_ANDROID_TEST_KEY_ALIAS']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Required stable test-signing secrets are missing')
          folder = Path(os.environ['RUNNER_TEMP']) / 'heapsandroid-signing'
          folder.mkdir(mode=0o700)
          key = folder / 'test.keystore'
          key.write_bytes(base64.b64decode(os.environ[names[0]], validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('HEAPS_ANDROID_TEST_KEYSTORE_PATH=' + str(key) + '\n')
          PY
      - name: Test and build stable proof APK
        if: github.event_name != 'pull_request'
        env:
          HEAPS_ANDROID_TEST_STORE_PASSWORD: ${{ secrets.HEAPS_ANDROID_TEST_STORE_PASSWORD }}
          HEAPS_ANDROID_TEST_KEY_PASSWORD: ${{ secrets.HEAPS_ANDROID_TEST_KEY_PASSWORD }}
          HEAPS_ANDROID_TEST_KEY_ALIAS: ${{ secrets.HEAPS_ANDROID_TEST_KEY_ALIAS }}
        run: ./scripts/build-apk.sh --variant=proof
      - name: Test and build ephemeral PR APK
        if: github.event_name == 'pull_request'
        run: ./scripts/build-apk.sh --variant=debug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'heaps-android-debug-ephemeral' || 'heaps-android-proof' }}
          path: |
            dist/heaps-android-proof.apk
            dist/heaps-android-proof.apk.sha256
            dist/verification/apk.json
            dist/verification/signature.txt
            third_party/licenses/openal/
            third_party/dependencies.lock.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove decoded private identity
        if: always() && github.event_name != 'pull_request'
        run: rm -rf "$RUNNER_TEMP/heapsandroid-signing"
